<nav class="navbar" aria-label="Main">
  <div class="nav-content">
    <div class="nav-brand">
      <a routerLink="/" class="brand-link">
        <span class="brand-name">ScopedAlerts</span>
      </a>
    </div>

    <div class="nav-actions">
      <a routerLink="/status" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link">
        Status
      </a>

      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="themeService.darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (themeService.darkMode()) { ☀️ } @else { 🌙 }
      </button>

      <div class="user-section">
        @if (userService.isGuest()) {
        <button
          type="button"
          class="login-btn"
          (click)="signIn()"
          [disabled]="userService.loading()"
        >
          @if (userService.loading()) { Signing in... } @else { Sign In }
        </button>
        } @else {
        <div class="user-info">
          <button
            type="button"
            class="user-name"
            title="Copy your user ID"
            (click)="copyUidToClipboard()"
          >
            {{ userService.user()?.displayName }}@if (userService.isAdmin()) { (Admin)}
          </button>
          <button
            type="button"
            class="logout-btn"
            (click)="signOut()"
            [disabled]="userService.loading()"
          >
            Sign Out
          </button>
        </div>
        }
      </div>
    </div>
  </div>
</nav>
